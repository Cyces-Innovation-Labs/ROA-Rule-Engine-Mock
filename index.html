<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROA Rule Engine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root"></div>

  <!-- Buildless React setup: CDN React/ReactDOM + in-browser Babel for JSX. No npm install, no server. -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Plain scripts, loaded natively by the browser — fine to open via file://. -->
  <script src="attributes.js"></script>
  <script src="rules.js"></script>
  <script src="calculation.js"></script>

  <!--
    The app itself is INLINE (not `src="app.js"`) on purpose: when Babel-in-browser
    transforms a `type="text/babel" src="...">` script, it fetches that file via XHR,
    and Chrome blocks XHR to file:// URLs (CORS). An external app.js would leave this
    page blank when opened by double-click instead of through a server. Inlining avoids
    the fetch entirely, so double-clicking index.html just works — see CLAUDE.md.
  -->
  <script type="text/babel">
    // ROA Rule Engine — Attribute catalog UI (React, buildless via Babel-in-browser).

    const { useState, useEffect, useRef } = React;

    const TYPE_LABELS = {
      number: 'Number',
      enum: 'Enum',
      date: 'Date',
      boolean: 'Boolean',
      text: 'Text',
    };

    // Shared "⋮" actions menu — every table's row actions (Edit/History/
    // Delete/Run/etc.) collapse into this instead of one button per
    // action, so a wide action set doesn't force the whole table wider.
    // `items`: [{ label, onClick, danger?, disabled?, hidden? }].
    function ActionsMenu({ items }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);

      useEffect(() => {
        if (!open) return;
        function handleClickOutside(e) {
          if (ref.current && !ref.current.contains(e.target)) setOpen(false);
        }
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, [open]);

      const visibleItems = items.filter((item) => !item.hidden);

      return (
        <div className="actions-menu" ref={ref}>
          <button type="button" className="icon-btn" title="Actions" onClick={() => setOpen((o) => !o)}>⋮</button>
          {open && (
            <div className="actions-menu-list">
              {visibleItems.map((item, i) => (
                <button
                  key={i}
                  type="button"
                  className={'actions-menu-item' + (item.danger ? ' actions-menu-item-danger' : '')}
                  disabled={item.disabled}
                  onClick={() => { setOpen(false); item.onClick(); }}
                >
                  {item.label}
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

    function ChipInput({ values, onChange, placeholder }) {
      const [draft, setDraft] = useState('');

      function commitDraft() {
        const v = draft.trim();
        if (v && !values.includes(v)) {
          onChange([...values, v]);
        }
        setDraft('');
      }

      function handleKeyDown(e) {
        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          commitDraft();
        } else if (e.key === 'Backspace' && !draft && values.length > 0) {
          onChange(values.slice(0, -1));
        }
      }

      function removeAt(idx) {
        onChange(values.filter((_, i) => i !== idx));
      }

      return (
        <div className="chip-input">
          {values.map((v, i) => (
            <span className="chip" key={v + i}>
              {v}
              <button type="button" className="chip-remove" onClick={() => removeAt(i)} aria-label={`Remove ${v}`}>
                ×
              </button>
            </span>
          ))}
          <input
            type="text"
            value={draft}
            placeholder={values.length === 0 ? placeholder : ''}
            onChange={(e) => setDraft(e.target.value)}
            onKeyDown={handleKeyDown}
            onBlur={commitDraft}
          />
        </div>
      );
    }

    function emptyForm() {
      return {
        id: '',
        idTouched: false,
        label: '',
        type: 'number',
        valueLabel: '',
        resolverRoot: 'transaction',
        resolverField: '',
        allowedValuesKind: 'static',
        staticValues: [],
        tableRefTable: TABLE_REF_TABLE_KEYS[0],
        note: '',
      };
    }

    function formFromAttribute(attr) {
      const { root, field } = splitResolverPath(attr.resolver && attr.resolver.path);
      const source = attr.allowedValuesSource;
      return {
        id: attr.id,
        idTouched: true,
        label: attr.label,
        type: attr.type,
        valueLabel: attr.valueLabel,
        resolverRoot: root,
        resolverField: field,
        allowedValuesKind: source && source.type === 'table_ref' ? 'table_ref' : 'static',
        staticValues: source && source.type === 'static' ? source.values : [],
        tableRefTable: source && source.type === 'table_ref' ? source.table : TABLE_REF_TABLE_KEYS[0],
        note: attr.note || '',
      };
    }

    function AttributeForm({ initial, editingId, existingAttributes, onSave, onCancel }) {
      const [form, setForm] = useState(initial || emptyForm());
      const [errors, setErrors] = useState({});

      function update(patch) {
        setForm((f) => ({ ...f, ...patch }));
      }

      function handleLabelChange(label) {
        update({
          label,
          id: form.idTouched ? form.id : slugify(label),
        });
      }

      function handleSubmit(e) {
        e.preventDefault();
        const foundErrors = validateAttribute(form, existingAttributes, editingId);
        if (Object.keys(foundErrors).length > 0) {
          setErrors(foundErrors);
          return;
        }
        const attribute = buildAttribute(form);
        onSave(attribute);
      }

      const derivedOperators = operatorsForType(form.type);
      const derivedWidget = valueWidgetForType(form.type);

      return (
        <form className="attribute-form" onSubmit={handleSubmit}>
          <h2>{editingId ? 'Edit Attribute' : 'New Attribute'}</h2>

          <div className="field">
            <label>Label</label>
            <input
              type="text"
              value={form.label}
              onChange={(e) => handleLabelChange(e.target.value)}
              placeholder="e.g. Transaction Amount"
            />
            {errors.label && <div className="field-error">{errors.label}</div>}
          </div>

          <div className="field">
            <label>Key</label>
            <input
              type="text"
              value={form.id}
              onChange={(e) => update({ id: e.target.value, idTouched: true })}
              placeholder="e.g. transaction_amount"
            />
            {errors.id && <div className="field-error">{errors.id}</div>}
          </div>

          <div className="field">
            <label>Type</label>
            <select value={form.type} onChange={(e) => update({ type: e.target.value })}>
              {ATTRIBUTE_TYPES.map((t) => (
                <option key={t} value={t}>
                  {TYPE_LABELS[t]}
                </option>
              ))}
            </select>
            {errors.type && <div className="field-error">{errors.type}</div>}
          </div>

          <div className="field readonly-derived">
            <label>Operators (derived from type)</label>
            <div className="derived-pills">
              {derivedOperators.map((op) => (
                <span className="pill" key={op}>
                  {OPERATOR_LABELS[op] || op}
                </span>
              ))}
            </div>
          </div>

          <div className="field readonly-derived">
            <label>Value widget (derived from type)</label>
            <div className="derived-pills">
              <span className="pill">{VALUE_WIDGET_LABELS[derivedWidget]}</span>
            </div>
          </div>

          <div className="field">
            <label>Value label</label>
            <input
              type="text"
              value={form.valueLabel}
              onChange={(e) => update({ valueLabel: e.target.value })}
              placeholder={form.label ? `defaults to "${form.label}"` : 'e.g. Count'}
            />
          </div>

          <div className="field">
            <label>Resolver</label>
            <div className="resolver-row">
              <select
                value={form.resolverRoot}
                onChange={(e) => update({ resolverRoot: e.target.value, resolverField: '' })}
              >
                {RESOLVER_ROOTS.map((r) => (
                  <option key={r} value={r}>{RESOLVER_ROOT_LABELS[r]}</option>
                ))}
              </select>
              <span className="resolver-dot">.</span>
              <input
                type="text"
                list="resolver-field-suggestions"
                value={form.resolverField}
                onChange={(e) => update({ resolverField: e.target.value })}
                placeholder="e.g. plan"
              />
              <datalist id="resolver-field-suggestions">
                {(RESOLVER_FIELD_SUGGESTIONS_BY_ROOT[form.resolverRoot] || []).map((f) => (
                  <option key={f} value={f} />
                ))}
              </datalist>
            </div>
            {form.resolverField && (
              <div className="derived-pills">
                <span className="pill">Resolves to: {form.resolverRoot}.{form.resolverField}</span>
              </div>
            )}
            {errors.resolverRoot && <div className="field-error">{errors.resolverRoot}</div>}
            {errors.resolverField && <div className="field-error">{errors.resolverField}</div>}
          </div>

          {form.type === 'enum' && (
            <div className="field enum-source">
              <label>Allowed values</label>
              <div className="radio-row">
                <label>
                  <input
                    type="radio"
                    name="allowedValuesKind"
                    checked={form.allowedValuesKind === 'static'}
                    onChange={() => update({ allowedValuesKind: 'static' })}
                  />
                  Category (fixed list)
                </label>
                <label>
                  <input
                    type="radio"
                    name="allowedValuesKind"
                    checked={form.allowedValuesKind === 'table_ref'}
                    onChange={() => update({ allowedValuesKind: 'table_ref' })}
                  />
                  Reference (live dataset)
                </label>
              </div>

              {form.allowedValuesKind === 'static' && (
                <div>
                  <ChipInput
                    values={form.staticValues}
                    onChange={(values) => update({ staticValues: values })}
                    placeholder="Type a value and press Enter"
                  />
                  {errors.staticValues && <div className="field-error">{errors.staticValues}</div>}
                </div>
              )}

              {form.allowedValuesKind === 'table_ref' && (
                <div>
                  <select
                    value={form.tableRefTable}
                    onChange={(e) => update({ tableRefTable: e.target.value })}
                  >
                    {TABLE_REF_TABLE_KEYS.map((key) => (
                      <option key={key} value={key}>{TABLE_REF_TABLES[key].label}</option>
                    ))}
                  </select>
                  <div className="derived-pills">
                    <span className="pill">value: {TABLE_REF_TABLES[form.tableRefTable].valueField}</span>
                    <span className="pill">label: {TABLE_REF_TABLES[form.tableRefTable].labelField}</span>
                  </div>
                  {errors.tableRefTable && <div className="field-error">{errors.tableRefTable}</div>}
                </div>
              )}
            </div>
          )}

          <div className="field">
            <label>Note (optional — e.g. a caveat that this isn't confirmed as available from the source system yet)</label>
            <input
              type="text"
              value={form.note}
              onChange={(e) => update({ note: e.target.value })}
              placeholder="e.g. Not confirmed this comes from SkySlope"
            />
          </div>

          <div className="form-actions">
            <button type="submit" className="btn-primary">
              {editingId ? 'Save changes' : 'Add Attribute'}
            </button>
            <button type="button" className="btn-secondary" onClick={onCancel}>
              Cancel
            </button>
          </div>
        </form>
      );
    }

    function allowedValuesDisplay(attribute) {
      if (attribute.type !== 'enum' || !attribute.allowedValuesSource) return '—';
      const source = attribute.allowedValuesSource;
      return source.type === 'static' ? source.values.join(', ') : `table: ${source.table}`;
    }

    function AttributeRow({ attribute, onEdit, onDelete, onToggleHistory, historyExpanded }) {
      return (
        <tr>
          <td>
            {attribute.label} <span className="version-tag">v{attribute.version}</span>
          </td>
          <td><code>{attribute.id}</code></td>
          <td>{TYPE_LABELS[attribute.type]}</td>
          <td>{attribute.valueLabel}</td>
          <td><code>{attribute.resolver.path}</code></td>
          <td>{allowedValuesDisplay(attribute)}</td>
          <td>{attribute.note && <span className="note-flag" title={attribute.note}>⚠ {attribute.note}</span>}</td>
          <td className="actions-cell">
            <ActionsMenu items={[
              { label: 'Edit', onClick: () => onEdit(attribute) },
              { label: historyExpanded ? 'Hide history' : 'History', onClick: () => onToggleHistory(attribute.id) },
              { label: 'Delete', onClick: () => onDelete(attribute), danger: true },
            ]} />
          </td>
        </tr>
      );
    }

    function HistoryTable({ versions }) {
      return (
        <div className="table-scroll"><table className="history-table">
          <thead>
            <tr>
              <th>Version</th>
              <th>Updated</th>
              <th>Label</th>
              <th>Type</th>
              <th>Value label</th>
              <th>Resolver path</th>
              <th>Allowed values</th>
              <th>Note</th>
            </tr>
          </thead>
          <tbody>
            {versions.map((v) => (
              <tr key={v.version}>
                <td>v{v.version}</td>
                <td>{new Date(v.updatedAt).toLocaleString()}</td>
                <td>{v.label}</td>
                <td>{TYPE_LABELS[v.type]}</td>
                <td>{v.valueLabel}</td>
                <td><code>{v.resolver.path}</code></td>
                <td>{allowedValuesDisplay(v)}</td>
                <td>{v.note}</td>
              </tr>
            ))}
          </tbody>
        </table>
            </div>
      );
    }

    function AttributesScreen() {
      // Every version ever saved, flat — see attributes.js's versioning
      // helpers. The catalog view below only ever shows currentAttributes().
      const [allVersions, setAllVersions] = useState([]);
      const [showForm, setShowForm] = useState(false);
      const [editingAttribute, setEditingAttribute] = useState(null);
      const [expandedHistoryId, setExpandedHistoryId] = useState(null);

      const attributes = currentAttributes(allVersions);

      useEffect(() => {
        let cancelled = false;
        loadAttributes().then((loaded) => {
          if (!cancelled) setAllVersions(loaded);
        });
        return () => { cancelled = true; };
      }, []);

      async function persist(next) {
        const previous = allVersions;
        setAllVersions(next); // optimistic — rolled back below if the save fails
        try {
          await saveAttributes(next);
        } catch (e) {
          setAllVersions(previous);
          window.alert(`Failed to save: ${e.message}\n\nIs the local server running? (node server.js)`);
        }
      }

      // Editing appends a new version rather than mutating the old one in
      // place, so past versions stay in the file for the History view.
      function handleSave(attributeDraft) {
        const version = editingAttribute
          ? nextVersionNumber(allVersions, attributeDraft.id)
          : 1;
        const versionedAttribute = { ...attributeDraft, version, updatedAt: new Date().toISOString() };
        persist([...allVersions, versionedAttribute]);
        setShowForm(false);
        setEditingAttribute(null);
      }

      function handleEdit(attribute) {
        setEditingAttribute(attribute);
        setShowForm(true);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // Delete removes every version of this Attribute — not itself
      // versioned/soft-deleted for now, only edits are (see CLAUDE.md).
      function handleDelete(attribute) {
        if (window.confirm(`Delete Attribute "${attribute.label}"? This removes its full version history too.`)) {
          persist(allVersions.filter((a) => a.id !== attribute.id));
          if (expandedHistoryId === attribute.id) setExpandedHistoryId(null);
        }
      }

      function handleToggleHistory(id) {
        setExpandedHistoryId((current) => (current === id ? null : id));
      }

      function handleCancel() {
        setShowForm(false);
        setEditingAttribute(null);
      }

      return (
        <div>
          {!showForm && (
            <div className="toolbar">
              <button className="btn-primary" onClick={() => setShowForm(true)}>+ New Attribute</button>
            </div>
          )}

          {showForm && (
            <AttributeForm
              key={editingAttribute ? editingAttribute.id : 'new'}
              initial={editingAttribute ? formFromAttribute(editingAttribute) : emptyForm()}
              editingId={editingAttribute ? editingAttribute.id : null}
              existingAttributes={attributes}
              onSave={handleSave}
              onCancel={handleCancel}
            />
          )}

          {attributes.length === 0 ? (
            <div className="empty-state">No Attributes yet. Click "+ New Attribute" to create one.</div>
          ) : (
            <div className="table-scroll">
            <table className="attribute-table">
              <thead>
                <tr>
                  <th>Label</th>
                  <th>Key</th>
                  <th>Type</th>
                  <th>Value label</th>
                  <th>Resolver path</th>
                  <th>Allowed values</th>
                  <th>Note</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {attributes.map((a) => (
                  <React.Fragment key={a.id}>
                    <AttributeRow
                      attribute={a}
                      onEdit={handleEdit}
                      onDelete={handleDelete}
                      onToggleHistory={handleToggleHistory}
                      historyExpanded={expandedHistoryId === a.id}
                    />
                    {expandedHistoryId === a.id && (
                      <tr className="history-row">
                        <td colSpan="8">
                          <HistoryTable versions={versionsForId(allVersions, a.id)} />
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                ))}
              </tbody>
            </table>
            </div>
          )}
        </div>
      );
    }

    // --- Rules screen --------------------------------------------------
    // Conditions build on the Attribute catalog (AttributesScreen above);
    // see CLAUDE.md "Domain model — Rules" for the scope-collapse decision
    // and rules.js for the condition/amount data model this UI edits.

    // UX-only helper (no data-model change): groups Attributes by their
    // resolver root (Transaction/Agent/Team, from attributes.js's own
    // RESOLVER_ROOTS/splitResolverPath) so an <select> can render them as
    // <optgroup>s instead of one flat 20+ item list.
    function groupAttributesByRoot(attributes) {
      const byRoot = new Map();
      for (const root of RESOLVER_ROOTS) byRoot.set(root, []);
      for (const attribute of attributes) {
        const root = attribute.resolver && attribute.resolver.kind === 'path'
          ? splitResolverPath(attribute.resolver.path).root
          : 'transaction';
        if (!byRoot.has(root)) byRoot.set(root, []);
        byRoot.get(root).push(attribute);
      }
      return Array.from(byRoot.entries())
        .filter(([, attrs]) => attrs.length > 0)
        .map(([root, attrs]) => ({ label: RESOLVER_ROOT_LABELS[root] || root, attrs }));
    }

    function AttributeSelect({ attributes, value, onChange, placeholder }) {
      const groups = groupAttributesByRoot(attributes);
      return (
        <select value={value} onChange={(e) => onChange(e.target.value)}>
          <option value="" disabled>{placeholder || 'Attribute...'}</option>
          {groups.map((g) => (
            <optgroup key={g.label} label={g.label}>
              {g.attrs.map((a) => (
                <option key={a.id} value={a.id}>{a.label}</option>
              ))}
            </optgroup>
          ))}
        </select>
      );
    }

    function ConditionValueInput({ attribute, operator, value, onChange }) {
      const shape = conditionValueShape(operator);
      if (shape === 'none') return null;

      if (shape === 'range') {
        const v = value || {};
        const inputType = attribute.type === 'number' || attribute.type === 'date' ? attribute.type : 'text';
        return (
          <div className="condition-range">
            <input
              type={inputType === 'date' ? 'date' : inputType === 'number' ? 'number' : 'text'}
              value={v.min ?? ''}
              placeholder="Min"
              onChange={(e) => onChange({ ...v, min: e.target.value })}
            />
            <span>–</span>
            <input
              type={inputType === 'date' ? 'date' : inputType === 'number' ? 'number' : 'text'}
              value={v.max ?? ''}
              placeholder="Max"
              onChange={(e) => onChange({ ...v, max: e.target.value })}
            />
          </div>
        );
      }

      if (shape === 'list') {
        const values = Array.isArray(value) ? value : [];
        if (attribute.type === 'enum' && attribute.allowedValuesSource && attribute.allowedValuesSource.type === 'static') {
          return (
            <div className="chip-input value-chip-list">
              {attribute.allowedValuesSource.values.map((v) => (
                <label key={v} className={'value-chip-toggle' + (values.includes(v) ? ' selected' : '')}>
                  <input
                    type="checkbox"
                    checked={values.includes(v)}
                    onChange={(e) =>
                      onChange(e.target.checked ? [...values, v] : values.filter((x) => x !== v))
                    }
                  />
                  {v}
                </label>
              ))}
            </div>
          );
        }
        // Number/date Attributes, or table_ref enums (no fixed value list to pick from) — free text chips.
        return <ChipInput values={values} onChange={onChange} placeholder="Type a value and press Enter" />;
      }

      // single
      if (attribute.type === 'boolean') {
        return (
          <select value={value === undefined ? '' : String(value)} onChange={(e) => onChange(e.target.value === 'true')}>
            <option value="" disabled>Choose...</option>
            <option value="true">True</option>
            <option value="false">False</option>
          </select>
        );
      }
      if (attribute.type === 'enum' && attribute.allowedValuesSource && attribute.allowedValuesSource.type === 'static') {
        return (
          <select value={value ?? ''} onChange={(e) => onChange(e.target.value)}>
            <option value="" disabled>Choose...</option>
            {attribute.allowedValuesSource.values.map((v) => (
              <option key={v} value={v}>{v}</option>
            ))}
          </select>
        );
      }
      if (attribute.type === 'date') {
        return <input type="date" value={value ?? ''} onChange={(e) => onChange(e.target.value)} />;
      }
      return (
        <input
          type={attribute.type === 'number' ? 'number' : 'text'}
          value={value ?? ''}
          placeholder={attribute.valueLabel}
          onChange={(e) =>
            onChange(attribute.type === 'number' ? (e.target.value === '' ? '' : Number(e.target.value)) : e.target.value)
          }
        />
      );
    }

    function ConditionRow({ condition, attributes, onChange, onRemove }) {
      const attribute = attributes.find((a) => a.id === condition.attributeId);
      const operators = attribute ? operatorsForType(attribute.type) : [];

      function handleAttributeChange(attributeId) {
        onChange({ ...condition, attributeId, operator: '', value: undefined });
      }
      function handleOperatorChange(operator) {
        onChange({ ...condition, operator, value: undefined });
      }

      return (
        <div className="condition-row condition-sentence">
          <AttributeSelect attributes={attributes} value={condition.attributeId} onChange={handleAttributeChange} />
          <select
            className="condition-operator"
            value={condition.operator}
            onChange={(e) => handleOperatorChange(e.target.value)}
            disabled={!attribute}
          >
            <option value="" disabled>Test...</option>
            {operators.map((op) => (
              <option key={op} value={op}>{OPERATOR_LABELS[op] || op}</option>
            ))}
          </select>
          {attribute && condition.operator && (
            <ConditionValueInput
              attribute={attribute}
              operator={condition.operator}
              value={condition.value}
              onChange={(value) => onChange({ ...condition, value })}
            />
          )}
          <button type="button" className="icon-btn icon-btn-danger" title="Remove condition" onClick={onRemove}>✕</button>
        </div>
      );
    }

    function ConditionGroupEditor({ group, attributes, onChange, onRemove, depth }) {
      function updateChild(index, updatedChild) {
        const children = group.children.slice();
        children[index] = updatedChild;
        onChange({ ...group, children });
      }
      function removeChild(index) {
        const children = group.children.slice();
        children.splice(index, 1);
        onChange({ ...group, children });
      }

      return (
        <div className={`condition-group depth-${depth % 3}`} style={{ marginLeft: depth * 20 }}>
          <div className="condition-group-header">
            <div className="match-toggle" role="group" aria-label="Match all or any">
              <button
                type="button"
                className={'match-toggle-btn' + (group.op === 'AND' ? ' active' : '')}
                onClick={() => onChange({ ...group, op: 'AND' })}
              >
                Match ALL of these
              </button>
              <button
                type="button"
                className={'match-toggle-btn' + (group.op === 'OR' ? ' active' : '')}
                onClick={() => onChange({ ...group, op: 'OR' })}
              >
                Match ANY of these
              </button>
            </div>
            {onRemove && (
              <button type="button" className="icon-btn icon-btn-danger" title="Remove group" onClick={onRemove}>✕</button>
            )}
          </div>

          {group.children.length === 0 && (
            <div className="empty-state condition-empty">Matches every transaction — no conditions added yet.</div>
          )}

          {group.children.map((child, i) => (
            <div key={i} className="condition-child">
              {i > 0 && <div className="condition-connector">{group.op === 'AND' ? 'and' : 'or'}</div>}
              {child.kind === 'group' ? (
                <ConditionGroupEditor
                  group={child}
                  attributes={attributes}
                  onChange={(updated) => updateChild(i, updated)}
                  onRemove={() => removeChild(i)}
                  depth={depth + 1}
                />
              ) : (
                <ConditionRow
                  condition={child}
                  attributes={attributes}
                  onChange={(updated) => updateChild(i, updated)}
                  onRemove={() => removeChild(i)}
                />
              )}
            </div>
          ))}

          <div className="condition-group-actions">
            <button type="button" className="btn-secondary" onClick={() => onChange({ ...group, children: [...group.children, emptyCondition()] })}>
              + Condition
            </button>
            <button type="button" className="btn-secondary" onClick={() => onChange({ ...group, children: [...group.children, emptyConditionGroup()] })}>
              + Group
            </button>
          </div>
        </div>
      );
    }

    function AmountExpressionEditor({ amount, numberAttributes, allAttributes, onChange }) {
      return (
        <div className="amount-editor">
          <select value={amount.form} onChange={(e) => onChange(emptyAmount(e.target.value))}>
            {AMOUNT_FORMS.map((f) => (
              <option key={f} value={f}>{AMOUNT_FORM_LABELS[f]}</option>
            ))}
          </select>

          {amount.form === 'flat' && (
            <div className="field rate-field">
              <label>Amount ($)</label>
              <input
                type="number"
                step="0.01"
                value={centsToDollars(amount.cents)}
                onChange={(e) => onChange({ ...amount, cents: dollarsToCents(e.target.value) })}
              />
              <label>deducted from</label>
              <AttributeSelect attributes={numberAttributes} value={amount.baseAttributeId} onChange={(v) => onChange({ ...amount, baseAttributeId: v })} />
            </div>
          )}

          {amount.form === 'rate' && (
            <div className="field rate-field">
              <label>Percentage (%)</label>
              <input
                type="number"
                step="0.01"
                value={amount.pct}
                onChange={(e) => onChange({ ...amount, pct: Number(e.target.value) })}
              />
              <label>of</label>
              <AttributeSelect attributes={numberAttributes} value={amount.baseAttributeId} onChange={(v) => onChange({ ...amount, baseAttributeId: v })} />
            </div>
          )}

          {(amount.form === 'max' || amount.form === 'min') && (
            <div className="amount-nested">
              <div className="amount-branch">
                <label>{amount.form === 'max' ? 'Greater of — Option A' : 'Lesser of — Option A'}</label>
                <AmountExpressionEditor
                  amount={amount.a}
                  numberAttributes={numberAttributes}
                  allAttributes={allAttributes}
                  onChange={(a) => onChange({ ...amount, a })}
                />
              </div>
              <div className="amount-branch">
                <label>Option B</label>
                <AmountExpressionEditor
                  amount={amount.b}
                  numberAttributes={numberAttributes}
                  allAttributes={allAttributes}
                  onChange={(b) => onChange({ ...amount, b })}
                />
              </div>
            </div>
          )}

          {amount.form === 'ladder' && (
            <div className="ladder-editor">
              <div className="field">
                <label>Tracker</label>
                <select value={amount.tracker} onChange={(e) => onChange({ ...amount, tracker: e.target.value })}>
                  {TRACKER_OPTIONS.map((t) => (
                    <option key={t} value={t}>{TRACKER_LABELS[t]}</option>
                  ))}
                </select>
              </div>
              <div className="radio-row">
                <label>
                  <input type="radio" checked={amount.rateType === 'percent'} onChange={() => onChange({ ...amount, rateType: 'percent' })} />
                  Percent tiers
                </label>
                <label>
                  <input type="radio" checked={amount.rateType === 'flat'} onChange={() => onChange({ ...amount, rateType: 'flat' })} />
                  Flat-amount tiers
                </label>
              </div>
              <div className="field">
                <label>{amount.rateType === 'percent' ? 'of' : 'deducted from'}</label>
                <AttributeSelect attributes={numberAttributes} value={amount.baseAttributeId} onChange={(v) => onChange({ ...amount, baseAttributeId: v })} />
              </div>
              {amount.rows.map((row, i) => (
                <div className="ladder-row" key={i}>
                  <input
                    type="number"
                    step="0.01"
                    placeholder="Up to ($, blank = no limit)"
                    value={row.upTo === null ? '' : centsToDollars(row.upTo)}
                    onChange={(e) => {
                      const rows = amount.rows.slice();
                      rows[i] = { ...row, upTo: e.target.value === '' ? null : dollarsToCents(e.target.value) };
                      onChange({ ...amount, rows });
                    }}
                  />
                  <input
                    type="number"
                    step="0.01"
                    placeholder={amount.rateType === 'percent' ? '%' : '$'}
                    value={amount.rateType === 'percent' ? row.value : centsToDollars(row.value)}
                    onChange={(e) => {
                      const rows = amount.rows.slice();
                      const v = amount.rateType === 'percent' ? Number(e.target.value) : dollarsToCents(e.target.value);
                      rows[i] = { ...row, value: v };
                      onChange({ ...amount, rows });
                    }}
                  />
                  <button
                    type="button"
                    className="btn-link btn-danger"
                    onClick={() => {
                      const rows = amount.rows.slice();
                      rows.splice(i, 1);
                      onChange({ ...amount, rows });
                    }}
                  >
                    Remove
                  </button>
                </div>
              ))}
              <button
                type="button"
                className="btn-secondary"
                onClick={() => onChange({ ...amount, rows: [...amount.rows, { upTo: null, value: 0 }] })}
              >
                + Row
              </button>
            </div>
          )}

          {amount.form === 'capped_by' && (
            <div className="capped-by-editor">
              <div className="field">
                <label>Tracker</label>
                <select value={amount.tracker} onChange={(e) => onChange({ ...amount, tracker: e.target.value })}>
                  {TRACKER_OPTIONS.map((t) => (
                    <option key={t} value={t}>{TRACKER_LABELS[t]}</option>
                  ))}
                </select>
              </div>
              <div className="field">
                <label>Current progress Attribute (whose value gets subtracted from the target to find remaining room)</label>
                <AttributeSelect attributes={numberAttributes} value={amount.progressAttributeId} onChange={(v) => onChange({ ...amount, progressAttributeId: v })} />
              </div>
              <div className="field">
                <label>Target ($) — the tracker's full amount (e.g. $750 for Tech Fee Bucket)</label>
                <input
                  type="number"
                  step="0.01"
                  value={amount.target}
                  onChange={(e) => onChange({ ...amount, target: Number(e.target.value) })}
                />
              </div>
              <label>Amount (before capping)</label>
              <AmountExpressionEditor
                amount={amount.amount}
                numberAttributes={numberAttributes}
                allAttributes={allAttributes}
                onChange={(a) => onChange({ ...amount, amount: a })}
              />
            </div>
          )}

          {amount.form === 'from_facts' && (
            <div className="field">
              <label>Attribute</label>
              <AttributeSelect attributes={allAttributes} value={amount.attributeId} onChange={(v) => onChange({ ...amount, attributeId: v })} />
            </div>
          )}
        </div>
      );
    }

    // Branches — ordered (When condition, Amount) pairs on one Rule,
    // evaluated top-to-bottom, first match wins. Replaces a single
    // top-level amount so one Rule ("one fee_type") can vary its payout by
    // scenario (e.g. Company Dollar's floor differs by lease/sale/no-floor)
    // without a separate kind:adjust rule or branching logic inside the
    // amount expression itself — see rules.js's emptyBranch()/validateBranches().
    function BranchEditor({
      branch, index, isLast, attributes, attributesById, numberAttributes,
      onChange, onRemove, onMoveUp, onMoveDown, canRemove, expanded, onToggleExpanded,
    }) {
      const isCatchAll = !branch.when.children || branch.when.children.length === 0;
      const summary = isCatchAll
        ? 'Otherwise'
        : describeConditionGroup(branch.when, attributesById);

      return (
        <div className={'scenario-card' + (isCatchAll ? ' scenario-catchall' : '')}>
          <button type="button" className="scenario-header" onClick={onToggleExpanded}>
            <span className="scenario-toggle-icon">{expanded ? '▾' : '▸'}</span>
            <span className="scenario-number">{isLast && isCatchAll ? 'Otherwise' : `Scenario ${index + 1}`}</span>
            <span className="scenario-summary">
              {isCatchAll && !isLast ? '(no conditions)' : summary} <span className="scenario-arrow">→</span> {describeAmount(branch.amount, attributesById)}
            </span>
          </button>

          {expanded && (
            <div className="scenario-body">
              <div className="scenario-actions">
                <button type="button" className="icon-btn" title="Move up" onClick={onMoveUp} disabled={index === 0}>▲</button>
                <button type="button" className="icon-btn" title="Move down" onClick={onMoveDown} disabled={isLast}>▼</button>
                <button type="button" className="icon-btn icon-btn-danger" title="Remove scenario" onClick={onRemove} disabled={!canRemove}>✕</button>
              </div>

              {isLast && (
                <p className="form-section-hint">
                  Leave "When" empty so this scenario catches every transaction that didn't match one above it.
                </p>
              )}

              <div className="field">
                <label>When</label>
                <ConditionGroupEditor group={branch.when} attributes={attributes} onChange={(when) => onChange({ ...branch, when })} depth={0} />
              </div>
              <div className="field">
                <label>Amount</label>
                <AmountExpressionEditor
                  amount={branch.amount}
                  numberAttributes={numberAttributes}
                  allAttributes={attributes}
                  onChange={(amount) => onChange({ ...branch, amount })}
                />
              </div>
            </div>
          )}
        </div>
      );
    }

    function BranchesEditor({ branches, attributes, numberAttributes, onChange }) {
      // Purely visual — which scenario cards are expanded. Defaults to
      // "all expanded" (same as before this change) so nothing is hidden
      // by surprise; collapsing is an option, not the default.
      const [collapsed, setCollapsed] = useState(() => new Set());
      const attributesById = Object.fromEntries(attributes.map((a) => [a.id, a]));

      function toggleExpanded(i) {
        setCollapsed((prev) => {
          const next = new Set(prev);
          if (next.has(i)) next.delete(i); else next.add(i);
          return next;
        });
      }

      function updateBranch(i, updated) {
        const next = branches.slice();
        next[i] = updated;
        onChange(next);
      }
      function removeBranch(i) {
        const next = branches.slice();
        next.splice(i, 1);
        onChange(next);
      }
      function moveBranch(i, direction) {
        const next = branches.slice();
        const j = i + direction;
        [next[i], next[j]] = [next[j], next[i]];
        onChange(next);
      }

      return (
        <div className="branches-editor">
          {branches.map((branch, i) => (
            <BranchEditor
              key={i}
              branch={branch}
              index={i}
              isLast={i === branches.length - 1}
              canRemove={branches.length > 1}
              attributes={attributes}
              attributesById={attributesById}
              numberAttributes={numberAttributes}
              expanded={!collapsed.has(i)}
              onToggleExpanded={() => toggleExpanded(i)}
              onChange={(updated) => updateBranch(i, updated)}
              onRemove={() => removeBranch(i)}
              onMoveUp={() => moveBranch(i, -1)}
              onMoveDown={() => moveBranch(i, 1)}
            />
          ))}
          <button type="button" className="btn-secondary" onClick={() => onChange([...branches, emptyBranch()])}>
            + Scenario
          </button>
        </div>
      );
    }

    function describeCondition(condition, attributesById) {
      const attribute = attributesById[condition.attributeId];
      if (!attribute) return '?';
      const opLabel = OPERATOR_LABELS[condition.operator] || condition.operator;
      const shape = conditionValueShape(condition.operator);
      if (shape === 'none') return `${attribute.label} ${opLabel}`;
      if (shape === 'range') return `${attribute.label} ${opLabel} ${condition.value?.min} and ${condition.value?.max}`;
      if (shape === 'list') return `${attribute.label} ${opLabel} [${(condition.value || []).join(', ')}]`;
      return `${attribute.label} ${opLabel} ${condition.value}`;
    }

    function describeConditionGroup(group, attributesById) {
      if (!group.children.length) return 'Every transaction';
      return group.children
        .map((c) => (c.kind === 'group' ? `(${describeConditionGroup(c, attributesById)})` : describeCondition(c, attributesById)))
        .join(` ${group.op} `);
    }

    function describeAmount(amount, attributesById) {
      switch (amount.form) {
        case 'flat':
          return `$${centsToDollars(amount.cents)} (from ${attributesById[amount.baseAttributeId]?.label || '?'})`;
        case 'rate':
          return `${amount.pct}% of ${attributesById[amount.baseAttributeId]?.label || '?'}`;
        case 'max':
          return `max(${describeAmount(amount.a, attributesById)}, ${describeAmount(amount.b, attributesById)})`;
        case 'min':
          return `min(${describeAmount(amount.a, attributesById)}, ${describeAmount(amount.b, attributesById)})`;
        case 'ladder': {
          const base = attributesById[amount.baseAttributeId]?.label || '?';
          return `ladder on ${TRACKER_LABELS[amount.tracker]} ${amount.rateType === 'percent' ? `of ${base}` : `(flat tiers, from ${base})`}`;
        }
        case 'capped_by': {
          const progressLabel = attributesById[amount.progressAttributeId]?.label || '?';
          return `min(${describeAmount(amount.amount, attributesById)}, ${TRACKER_LABELS[amount.tracker]} target $${amount.target} − ${progressLabel})`;
        }
        case 'from_facts':
          return `value of ${attributesById[amount.attributeId]?.label || '?'}`;
        default:
          return '?';
      }
    }

    function describeBranches(branches, attributesById) {
      return branches
        .map((b, i) => `${i + 1}. ${describeConditionGroup(b.when, attributesById)} → ${describeAmount(b.amount, attributesById)}`)
        .join('  |  ');
    }

    // Read-only, line-per-scenario rendering of describeBranches()'s data —
    // used in the rule list/history tables so multi-branch rules (e.g.
    // Company Dollar's 3 scenarios) read as a short list, not one long
    // run-on string.
    function BranchesSummaryList({ branches, attributesById }) {
      return (
        <ol className="branches-summary-list">
          {branches.map((b, i) => {
            const isLast = i === branches.length - 1;
            const isCatchAll = !b.when.children || b.when.children.length === 0;
            return (
              <li key={i}>
                {isCatchAll ? <em>{isLast ? 'Otherwise' : 'Every transaction'}</em> : describeConditionGroup(b.when, attributesById)}
                {' → '}
                {describeAmount(b.amount, attributesById)}
              </li>
            );
          })}
        </ol>
      );
    }

    // Compact one-line stand-in for the Branches column in the main table —
    // a full <ol> per row (4-11 lines for rules like Company Dollar/
    // Capped-Status Fee) made the list unreadable. Click to expand a proper
    // read-only scenario-card view (see BranchesReadOnlyCards) instead.
    function branchesCompactSummary(branches) {
      const n = branches.length;
      const last = branches[n - 1];
      const hasCatchAll = last && (!last.when.children || last.when.children.length === 0);
      if (n === 1) return hasCatchAll ? '1 scenario' : '1 scenario (conditional)';
      return `${n} scenarios${hasCatchAll ? ', +otherwise' : ''}`;
    }

    // Read-only scenario cards for the expanded Branches row in the main
    // table — same visual language as the editable BranchEditor cards, but
    // flat (no collapse toggle, no actions) since they're just for reading.
    function BranchesReadOnlyCards({ branches, attributesById }) {
      return (
        <div className="branches-editor">
          {branches.map((b, i) => {
            const isLast = i === branches.length - 1;
            const isCatchAll = !b.when.children || b.when.children.length === 0;
            return (
              <div key={i} className={'scenario-card' + (isCatchAll ? ' scenario-catchall' : '')}>
                <div className="scenario-header scenario-header-static">
                  <span className="scenario-number">{isLast && isCatchAll ? 'Otherwise' : `Scenario ${i + 1}`}</span>
                  <span className="scenario-summary">
                    {isCatchAll && !isLast ? '(no conditions)' : describeConditionGroup(b.when, attributesById)}
                    {' '}<span className="scenario-arrow">→</span>{' '}
                    {describeAmount(b.amount, attributesById)}
                  </span>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function describeApplies(rule, attributesById) {
      const appliesLabel = APPLIES_LABELS[rule.applies] || APPLIES_LABELS.per_transaction;
      if (!APPLIES_ALLOWING_SPLIT.includes(rule.applies)) return appliesLabel;
      if (rule.split === 'by_percent_attribute' || rule.split === 'divide_by_percent_attribute') {
        const verb = rule.split === 'divide_by_percent_attribute' ? 'divided by' : 'scaled by';
        return `${appliesLabel}, ${verb} ${attributesById[rule.splitAttributeId]?.label || '?'}`;
      }
      return `${appliesLabel}, ${SPLIT_LABELS.none}`;
    }

    function emptyRuleForm() {
      return {
        id: '',
        idTouched: false,
        label: '',
        waivable: false,
        conditions: emptyConditionGroup(),
        branches: [emptyBranch()],
        payee: 'roa',
        applies: 'per_transaction',
        split: 'none',
        splitAttributeId: '',
        contributesToTracker: 'none',
      };
    }

    function ruleFormFromRule(rule) {
      return {
        id: rule.id,
        idTouched: true,
        label: rule.label,
        waivable: !!rule.waivable,
        conditions: rule.conditions,
        branches: rule.branches,
        payee: rule.payee,
        applies: rule.applies || 'per_transaction',
        split: rule.split || 'none',
        splitAttributeId: rule.splitAttributeId || '',
        contributesToTracker: rule.contributesToTracker || 'none',
      };
    }

    // Live, plain-English "what will this rule actually do" summary — pure
    // presentation, built entirely from the existing describe*() helpers
    // and the form's own state. No data/flow change; just always-visible
    // feedback while authoring, instead of only seeing this after saving.
    function RuleSummary({ form, attributesById }) {
      const gate = describeConditionGroup(form.conditions, attributesById);
      const payeeLabel = PAYEE_LABELS[form.payee] || '(choose a payee)';
      const appliesLabel = describeApplies(form, attributesById);

      return (
        <div className="rule-summary">
          <div className="rule-summary-title">What this Rule does</div>
          <div className="rule-summary-line">
            <strong>Applies when:</strong> {gate}
          </div>
          <div className="rule-summary-line">
            <strong>Pays:</strong>
            <ol className="rule-summary-branches">
              {form.branches.map((b, i) => {
                const isCatchAll = !b.when.children || b.when.children.length === 0;
                return (
                  <li key={i}>
                    {isCatchAll ? <em>Otherwise</em> : describeConditionGroup(b.when, attributesById)}
                    {' → '}
                    {describeAmount(b.amount, attributesById)}
                  </li>
                );
              })}
            </ol>
          </div>
          <div className="rule-summary-line">
            <strong>Paid to:</strong> {payeeLabel} · <strong>Runs:</strong> {appliesLabel}
            {form.contributesToTracker !== 'none' && (
              <> · <strong>Feeds tracker:</strong> {CONTRIBUTES_TO_TRACKER_LABELS[form.contributesToTracker]}</>
            )}
            {form.waivable && <> · <strong>Waivable</strong></>}
          </div>
        </div>
      );
    }

    // Concrete worked example per `applies` value, shown on demand (click
    // the "?" next to the field) rather than always-on — the four values
    // are easy to state precisely but hard to tell apart from the label
    // alone (per_side vs per_agent_side especially), so an example beats a
    // longer label.
    const APPLIES_EXAMPLES = {
      per_transaction: 'Fires once no matter how many people or sides are on the deal.',
      per_side: "Fires once for each side. If two people share a side, they split that side's one amount — e.g. Risk Fee: a $50 side shared 70/30 pays $35/$15.",
      per_agent_side: 'Fires separately for every person on every side. Someone on 2 sides gets 2 independent amounts — e.g. Company Dollar: $500 on the listing side + $500 on the sale side.',
      per_distinct_agent: "Fires once per person for the whole deal, using ONE amount. That amount is then divided across their own sides — e.g. Capped-Status Fee: one $250 tier per person, split across their sides, not $250 on each side.",
    };

    function AppliesHelp() {
      const [open, setOpen] = useState(false);
      return (
        <>
          <button type="button" className="icon-btn" title="Show examples" onClick={() => setOpen((o) => !o)}>?</button>
          {open && (
            <div className="applies-help-box">
              {APPLIES_OPTIONS.map((a) => (
                <div key={a} className="applies-help-row">
                  <strong>{APPLIES_LABELS[a]}</strong>
                  <span>{APPLIES_EXAMPLES[a]}</span>
                </div>
              ))}
            </div>
          )}
        </>
      );
    }

    function RuleForm({ initial, editingId, existingRules, attributes, onSave, onCancel }) {
      const [form, setForm] = useState(initial || emptyRuleForm());
      const [errors, setErrors] = useState({});
      // Advanced settings auto-expand if they're already non-default (e.g.
      // editing a Rule that already uses per_agent_side) so nothing is
      // hidden by surprise — otherwise stay collapsed for a plain rule.
      const [showAdvanced, setShowAdvanced] = useState(
        (initial && (initial.applies !== 'per_transaction' || initial.contributesToTracker !== 'none' || initial.waivable)) || false
      );

      function update(patch) {
        setForm((f) => ({ ...f, ...patch }));
      }
      function handleLabelChange(label) {
        update({ label, id: form.idTouched ? form.id : slugify(label) });
      }

      const attributesById = Object.fromEntries(attributes.map((a) => [a.id, a]));
      const numberAttributes = attributes.filter((a) => a.type === 'number');

      function handleSubmit(e) {
        e.preventDefault();
        const foundErrors = validateRule(form, existingRules, editingId, attributesById);
        if (Object.keys(foundErrors).length > 0) {
          setErrors(foundErrors);
          return;
        }
        onSave(buildRule(form));
      }

      const advancedIsCustomized = form.applies !== 'per_transaction' || form.contributesToTracker !== 'none' || form.waivable;

      return (
        <form className="attribute-form rule-form" onSubmit={handleSubmit}>
          <h2>{editingId ? 'Edit Rule' : 'New Rule'}</h2>

          <RuleSummary form={form} attributesById={attributesById} />

          <div className="form-section">
            <div className="form-section-title">1. Identify this Rule</div>
            <div className="field">
              <label>Label</label>
              <input type="text" value={form.label} onChange={(e) => handleLabelChange(e.target.value)} placeholder="e.g. Risk Fee" />
              {errors.label && <div className="field-error">{errors.label}</div>}
            </div>

            <div className="field">
              <label>Key</label>
              <input type="text" value={form.id} onChange={(e) => update({ id: e.target.value, idTouched: true })} placeholder="e.g. risk_fee" />
              {errors.id && <div className="field-error">{errors.id}</div>}
            </div>
          </div>

          <div className="form-section">
            <div className="form-section-title">2. When does this apply?</div>
            <p className="form-section-hint">Leave empty to match every transaction.</p>
            <ConditionGroupEditor group={form.conditions} attributes={attributes} onChange={(conditions) => update({ conditions })} depth={0} />
            {errors.conditions && <div className="field-error">{errors.conditions}</div>}
          </div>

          <div className="form-section">
            <div className="form-section-title">3. How much, in each scenario?</div>
            <p className="form-section-hint">Checked top to bottom — the first matching scenario is used. Keep one "Otherwise" scenario at the end so every transaction that reaches this Rule gets an amount.</p>
            <BranchesEditor
              branches={form.branches}
              attributes={attributes}
              numberAttributes={numberAttributes}
              onChange={(branches) => update({ branches })}
            />
            {errors.branches && <div className="field-error">{errors.branches}</div>}
          </div>

          <div className="form-section">
            <div className="form-section-title">4. Who gets paid?</div>
            <div className="field">
              <label>Payee</label>
              <select value={form.payee} onChange={(e) => update({ payee: e.target.value })}>
                {PAYEE_OPTIONS.map((p) => (
                  <option key={p} value={p}>{PAYEE_LABELS[p]}</option>

              </select>
              {errors.payee && <div className="field-error">{errors.payee}</div>}

              {!showAdvanced && advancedIsCustomized && <span className="advanced-badge">customized</span>}
            </button>

                </div>

                {APPLIES_ALLOWING_SPLIT.includes(form.applies) && (
                  <div className="field">
                    <label>Split (how does the computed amount divide among the people who share it?)</label>
                    <select
                      value={form.split}
                      onChange={(e) => {
                        const split = e.target.value;
                        update(split === 'none' ? { split, splitAttributeId: '' } : { split });
                      }}
                    >
                      {SPLIT_OPTIONS.map((s) => (
                        <option key={s} value={s}>{SPLIT_LABELS[s]}</option>
                      ))}
                    </select>
                    {errors.split && <div className="field-error">{errors.split}</div>}

                    {(form.split === 'by_percent_attribute' || form.split === 'divide_by_percent_attribute') && (
                      <div className="field">
                        <label>Split percentage Attribute (each participant's own share, e.g. 60 for 60%)</label>
                        <AttributeSelect attributes={numberAttributes} value={form.splitAttributeId} onChange={(v) => update({ splitAttributeId: v })} />

                      </div>
                    )}

                )}

                <div className="field">
                  <label>Contributes to tracker (optional — does this Rule's own payment feed a tracker?)</label>
                  <select value={form.contributesToTracker} onChange={(e) => update({ contributesToTracker: e.target.value })}>
                    {CONTRIBUTES_TO_TRACKER_OPTIONS.map((t) => (
                      <option key={t} value={t}>{CONTRIBUTES_TO_TRACKER_LABELS[t]}</option>
                    ))}
                  </select>
                  {errors.contributesToTracker && <div className="field-error">{errors.contributesToTracker}</div>}

                <div className="field">
                  <label>
                    <input type="checkbox" checked={form.waivable} onChange={(e) => update({ waivable: e.target.checked })} />

          <div className="form-actions">
            <button type="submit" className="btn-primary">{editingId ? 'Save changes' : 'Add Rule'}</button>

    function RuleRow({ rule, attributesById, onEdit, onDelete, onToggleHistory, historyExpanded, onToggleBranches, branchesExpanded }) {
      return (
        <tr>
          <td>{rule.label} <span className="version-tag">v{rule.version}</span></td>
          <td><code>{rule.id}</code></td>

            <button className="btn-link branches-toggle" onClick={() => onToggleBranches(rule.id)}>

          <td>{PAYEE_LABELS[rule.payee]}</td>

      return (
        <div className="table-scroll"><table className="history-table">
          <thead>
            <tr>
              <th>Version</th>
              <th>Updated</th>
              <th>Label</th>
              <th>Conditions</th>
              <th>Branches</th>
              <th>Payee</th>
              <th>Applies</th>
              <th>Contributes to</th>
              <th>Waivable</th>
            </tr>
          </thead>

                <td>{new Date(v.updatedAt).toLocaleString()}</td>

                <td>{describeConditionGroup(v.conditions, attributesById)}</td>
                <td><BranchesSummaryList branches={v.branches} attributesById={attributesById} /></td>
                <td>{PAYEE_LABELS[v.payee]}</td>
                <td>{describeApplies(v, attributesById)}</td>
